<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LINE.js</title>
    <meta name="theme-color" content="#087e4f" />
    <meta name="description" content="本機 LINE 網頁客戶端" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <div id="offline" role="alert" aria-live="assertive" hidden>
      <div>
        <strong>與伺服器斷線</strong>
        <p>無法連線至本機服務，正在自動重新連線…恢復後會自動同步訊息。</p>
      </div>
    </div>
    <div id="notice" role="status" aria-live="polite" hidden>
      <span id="notice-text"></span>
      <a id="notice-link" target="_blank" rel="noopener noreferrer" hidden>版本說明</a>
      <button id="notice-action" type="button" hidden>重新整理</button>
      <button id="notice-close" type="button" class="ghost" aria-label="關閉通知" hidden>✕</button>
    </div>
    <main id="login">
      <header><span class="eyebrow">LOCAL LINE CLIENT</span><h1>LINE.js</h1></header>
      <p class="intro">訊息留在本機，連線從這裡開始。</p>
      <section aria-labelledby="login-title">
        <h2 id="login-title">使用 LINE 掃碼登入</h2>
        <p class="warning">非官方 LINE API 有帳號限制風險，請先使用次要帳號。</p>
        <p id="status" role="status" aria-live="polite">正在連線至本機服務…</p>
        <div id="qr-box" hidden><canvas id="qr" aria-label="LINE 登入 QR code"></canvas><p>開啟手機 LINE 掃描上方 QR code。</p></div>
        <p id="pin" hidden></p>
        <button id="start" type="button" disabled>產生登入 QR code</button>
      </section>
      <footer>僅限本機 · QR 與 PIN 不記錄、不落盤</footer>
    </main>

    <div id="app" hidden>
      <aside id="sidebar" class="sidebar" aria-label="聊天室清單">
        <header class="me">
          <span id="me-avatar" class="avatar-slot"></span>
          <strong id="me-name"></strong>
          <span id="listen-state" class="pill"></span>
          <button id="notify" type="button" class="ghost" aria-pressed="false">通知</button>
          <button id="logout" type="button" class="ghost">登出</button>
        </header>
        <div class="tabs" role="tablist" aria-label="清單類型">
          <button id="tab-chats" class="tab" type="button" role="tab" aria-selected="true" aria-controls="channels">聊天<span id="chats-unread" class="tab-badge" hidden></span></button>
          <button id="tab-friends" class="tab" type="button" role="tab" aria-selected="false" aria-controls="channels" tabindex="-1">好友</button>
        </div>
        <input id="filter" type="search" placeholder="搜尋聊天" aria-label="搜尋" autocomplete="off" />
        <ul id="channels" role="listbox" aria-label="清單"></ul>
        <p id="channels-empty" hidden>尚無聊天室。</p>
      </aside>
      <div id="drawer-backdrop" hidden></div>
      <section class="conversation" aria-label="訊息">
        <header class="conversation-head">
          <button id="menu" type="button" class="ghost" aria-label="開啟選單" aria-controls="sidebar" aria-expanded="false">☰</button>
          <span id="channel-avatar" class="avatar-slot"></span>
          <h2 id="channel-title">選擇一個聊天室</h2>
          <span id="channel-meta"></span>
          <button id="search-toggle" type="button" class="ghost" aria-pressed="false" aria-controls="search-bar" aria-keyshortcuts="Control+K Meta+K" title="搜尋已載入的訊息（Ctrl／⌘＋K）">搜尋</button>
        </header>
        <div id="search-bar" class="search-bar" hidden>
          <input id="message-search" type="search" placeholder="搜尋此聊天室的訊息" aria-label="搜尋訊息" autocomplete="off" />
          <span id="search-count"></span>
          <button id="search-close" type="button" class="ghost" aria-label="關閉搜尋">✕</button>
        </div>
        <div class="timeline">
          <div id="messages" role="log" aria-live="polite" tabindex="0"></div>
          <button id="jump" type="button" class="jump" hidden>↓ 最新訊息</button>
        </div>
        <form id="composer" class="composer" autocomplete="off">
          <p id="composer-note" role="status" aria-live="polite" hidden></p>
          <div id="sticker-panel" role="dialog" aria-label="傳送貼圖" hidden>
            <div id="sticker-tabs" role="tablist" aria-label="我的貼圖包"></div>
            <div id="sticker-grid" role="group" aria-label="貼圖"></div>
            <p id="sticker-state" role="status"></p>
            <details id="sticker-manual">
              <summary>用 ID 手動送出</summary>
              <div class="sticker-manual-row">
                <label>貼圖包 ID<input id="sticker-package" inputmode="numeric" maxlength="12" /></label>
                <label>貼圖 ID<input id="sticker-id" inputmode="numeric" maxlength="12" /></label>
                <img id="sticker-preview" alt="貼圖預覽" hidden />
                <button id="sticker-send" type="button">送出貼圖</button>
              </div>
            </details>
          </div>
          <div id="attachment" class="attachment" hidden>
            <img alt="待送出的圖片" hidden />
            <video muted controls preload="metadata" aria-label="待送出的影片" hidden></video>
            <span id="attachment-info"></span>
            <button id="attachment-send" type="button">送出</button>
            <button id="attachment-cancel" type="button" class="ghost">取消</button>
          </div>
          <div id="reply-bar" class="reply-bar" hidden>
            <span class="reply-label">回覆</span>
            <span id="reply-preview"></span>
            <button id="reply-cancel" type="button" class="ghost" aria-label="取消回覆">✕</button>
          </div>
          <div class="composer-row">
            <button id="attach" type="button" class="ghost" aria-label="傳送圖片或影片">媒體</button>
            <input id="file" type="file" multiple accept="image/png,image/jpeg,image/gif,video/mp4,video/quicktime" hidden />
            <button id="sticker-toggle" type="button" class="ghost" aria-haspopup="dialog" aria-expanded="false">貼圖</button>
            <textarea id="draft" rows="1" maxlength="8000" aria-label="訊息內容" disabled></textarea>
            <button id="send" type="submit" disabled>送出</button>
          </div>
        </form>
      </section>
    </div>

    <div id="context-menu" role="menu" aria-label="訊息選單" hidden></div>

    <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <div class="dialog-body">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button id="confirm-cancel" type="button" class="ghost">取消</button>
          <button id="confirm-ok" type="button">確定</button>
        </div>
      </div>
    </dialog>

    <dialog id="viewer" aria-label="圖片檢視">
      <img alt="" />
      <button type="button" class="ghost" aria-label="關閉">✕</button>
    </dialog>
  </body>
</html>
